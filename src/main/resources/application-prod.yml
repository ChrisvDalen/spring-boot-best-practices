# Production profile — activate with: --spring.profiles.active=prod
# Secrets must be injected via environment variables or a secrets manager.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Size the pool to match your DB's max_connections minus headroom for admin tools
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true
    # Fail fast if migration checksums don't match — detect accidental script edits
    validate-on-migrate: true

  data:
    redis:
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  rabbitmq:
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        # Expose only the endpoints needed by the observability stack
        include: health, info, prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.05}

logging:
  level:
    root: WARN
    com.example.bestpractices: INFO
    org.springframework.amqp: WARN
